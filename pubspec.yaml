name: canton_fair_crm
description: Offline-first Canton Fair trade lead capture and supplier shortlisting app.
publish_to: "none"
version: 1.1.9+10
environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_local_notifications: ^17.1.2
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  share_plus: ^13.3.0
  url_launcher: ^6.3.1
  mobile_scanner: ^7.4.0
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.14.0
  pdf: ^3.10.8
  timezone: ^0.9.4
  csv: ^6.0.0
  flutter_native_splash: ^2.4.3
  http: ^1.6.0
  package_info_plus: ^10.2.1
  flutter_secure_storage: ^11.0.0
  local_auth: ^2.3.0
  crypto: ^3.0.6
  supabase_flutter: ^2.10.3
  speech_to_text: ^7.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
