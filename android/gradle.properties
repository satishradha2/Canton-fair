org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
android.useAndroidX=true
# Required by the installed Flutter Gradle plugin while third-party plugins
# still apply the legacy Kotlin Gradle plugin.
android.newDsl=false
android.builtInKotlin=false
android.suppressUnsupportedCompileSdk=37.0
android.javaCompile.suppressSourceTargetDeprecationWarning=true
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
